<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  :root {
    --ink: #1F2A44;
    --ink-soft: #4B5568;
    --gold: #B8863B;
    --cream: #FAF7F0;
    --paper: #F3EEE1;
    --rule: #D9D2BE;
    --sage: #5C8374;
    --sage-soft: #E4ECE7;
    --terracotta: #B7472A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: transparent;
    font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
    color: var(--ink);
  }
  table {
    border-collapse: collapse;
    width: 100%;
    background: var(--cream);
  }
  th, td {
    border: 1px solid var(--rule);
    padding: 0;
    text-align: center;
    vertical-align: middle;
  }
  /* Column headers (time slots) */
  th {
    background: var(--ink);
    color: var(--cream);
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.03em;
    padding: 8px 4px;
    min-width: 80px;
  }
  th.day-header {
    background: var(--ink);
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.04em;
    min-width: 100px;
  }
  th.slot-header {
    background: var(--ink);
    white-space: nowrap;
  }
  th.slot-header .slot-time {
    display: block;
    font-weight: 400;
    font-size: 9px;
    opacity: 0.7;
    margin-top: 2px;
  }
  th.slot-header-break {
    background: #2D3A55;
    border-bottom: 2px solid var(--gold);
  }
  /* Row headers (days) */
  td.daylabel {
    background: var(--paper);
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 12px;
    color: var(--ink);
    white-space: nowrap;
    padding: 10px 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    min-width: 100px;
  }
  .cell-empty {
    cursor: pointer;
    color: #b3ac95;
    font-size: 18px;
    padding: 14px 4px;
    transition: background 0.12s ease;
  }
  .cell-empty:hover { background: var(--paper); color: var(--gold); }
  .cell-break {
    background: #EAE4D6;
    cursor: pointer;
    color: #8a8368;
    font-style: italic;
    font-size: 11px;
    padding: 10px 4px;
    transition: background 0.12s ease;
  }
  .cell-break:hover { background: #E0D9C8; color: var(--gold); }
  .cell-filled {
    background: var(--sage-soft);
    border-left: 3px solid var(--sage);
    padding: 6px 8px 6px 6px;
    position: relative;
    text-align: left;
    min-height: 48px;
  }
  .subj-code {
    font-family: "IBM Plex Mono", monospace;
    font-weight: 700;
    font-size: 12px;
    color: var(--sage);
  }
  .subj-name { font-size: 11px; color: var(--ink); margin-top: 1px; line-height: 1.2; }
  .subj-teacher { font-size: 10px; color: var(--ink-soft); margin-top: 2px; }
  .clear-btn {
    position: absolute;
    top: 2px;
    right: 2px;
    cursor: pointer;
    color: var(--terracotta);
    font-size: 16px;
    font-weight: 700;
    line-height: 1;
    opacity: 0.7;
    padding: 4px 7px;
    border-radius: 3px;
    transition: opacity 0.12s ease, background 0.12s ease;
  }
  .clear-btn:hover { opacity: 1; background: rgba(183,71,42,0.12); }
  .span-badge { font-size: 9px; color: var(--ink-soft); margin-top: 3px; font-style: italic; }
  .assign-form { padding: 4px; }
  .assign-form select { margin-bottom: 4px; }
  .span-row { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; font-size: 10px; color: var(--ink-soft); }
  .span-row select { width: auto; min-width: 44px; }
  .cancel-link { font-size: 10px; color: var(--terracotta); cursor: pointer; margin-top: 2px; text-align: center; }
  .cancel-link:hover { text-decoration: underline; }
  select {
    width: 100%;
    padding: 6px 4px;
    border-radius: 0;
    background: #fff;
    color: var(--ink);
    border: 1px solid var(--gold);
    font-size: 11px;
  }
  .empty-note {
    font-size: 11px;
    color: #8a8368;
    padding: 10px;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const html = htm.bind(React.createElement);
const e = React.createElement;

function postToStreamlit(type, extra) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
}
function reportHeight() {
  const h = document.documentElement.scrollHeight;
  postToStreamlit("streamlit:setFrameHeight", { height: h + 12 });
}
function setComponentValue(value) {
  postToStreamlit("streamlit:setComponentValue", { value: value });
}

/* ── Merge detection (horizontal: same subject in consecutive slots on same day) ── */
function computeMerges(days, slots, assignments) {
  const spanMap = {};   // key -> N  (first cell of a horizontal group, N >= 2)
  const skipSet = {};   // key -> true  (swallowed cells)
  for (const day of days) {
    let i = 0;
    while (i < slots.length) {
      const key = day + "|" + slots[i].id;
      const entry = assignments[key];
      if (entry) {
        let span = 1;
        while (i + span < slots.length) {
          const nk = day + "|" + slots[i + span].id;
          const ne = assignments[nk];
          if (ne && ne.subject_id === entry.subject_id) { span++; } else { break; }
        }
        if (span > 1) {
          spanMap[key] = span;
          for (let j = 1; j < span; j++) skipSet[day + "|" + slots[i + j].id] = true;
        }
        i += span;
      } else {
        i++;
      }
    }
  }
  return { spanMap, skipSet };
}

function maxEmptySpan(day, slotIdx, slots, assignments) {
  let n = 0;
  for (let i = slotIdx; i < slots.length; i++) {
    if (assignments[day + "|" + slots[i].id]) break;
    n++;
  }
  return Math.max(n, 1);
}

/* ── Cell component ── */
function Cell({ day, slot, entry, subjects, isOpen, onOpen, onClose, onAssign, onClear, colSpan, isBreak, maxSpan }) {
  /* Filled */
  if (entry) {
    const cs = colSpan || 1;
    return html`
      <td colSpan=${cs}>
        <div class="cell-filled">
          <span class="clear-btn" title="Remove" onClick=${() => onClear(day, slot.id, cs)}>×</span>
          <div class="subj-code">${entry.subject_code}</div>
          <div class="subj-name">${entry.subject_name}</div>
          <div class="subj-teacher">${entry.teacher_name || "No teacher assigned"}</div>
          ${cs > 1 ? html`<div class="span-badge">${cs} periods</div>` : null}
        </div>
      </td>
    `;
  }

  /* Open (assign form) */
  if (isOpen) {
    const ms = maxSpan || 1;
    return html`
      <td>
        <div class="assign-form">
          ${ms > 1 ? html`
            <div class="span-row">
              <span>Periods:</span>
              <select class="span-sel">
                ${Array.from({length: ms}, (_, i) => i + 1).map(n =>
                  html`<option key=${n} value=${n}>${n}</option>`
                )}
              </select>
            </div>
          ` : null}
          <select
            autoFocus
            onChange=${(ev) => {
              const val = ev.target.value;
              if (val) {
                const spanEl = ev.target.parentElement.querySelector('.span-sel');
                const span = spanEl ? parseInt(spanEl.value, 10) : 1;
                onAssign(day, slot.id, parseInt(val, 10), span);
              }
            }}
          >
            <option value="">— choose subject —</option>
            ${subjects.map(
              (s) => html`<option key=${s.id} value=${s.id}>${s.code} - ${s.name} (${s.assigned_count}/${s.credit} used)</option>`
            )}
          </select>
          <div class="cancel-link" onClick=${(ev) => { ev.stopPropagation(); onClose(); }}>cancel</div>
        </div>
      </td>
    `;
  }

  /* Empty break cell */
  if (isBreak) {
    return html`
      <td>
        <div class="cell-break" onClick=${() => onOpen(day, slot.id)}>${slot.label}</div>
      </td>
    `;
  }

  /* Empty regular cell */
  return html`
    <td>
      <div class="cell-empty" onClick=${() => onOpen(day, slot.id)}>+</div>
    </td>
  `;
}

/* ── App (transposed: days = rows, slots = columns) ── */
function App({ args }) {
  const { days = [], slots = [], assignments = {}, subjects = [] } = args || {};
  const [openCell, setOpenCell] = React.useState(null);

  React.useEffect(() => { reportHeight(); });

  if (!slots.length) {
    return html`<div class="empty-note">No time slots defined yet. Add periods on the "Time Slots" page first.</div>`;
  }

  const { spanMap, skipSet } = computeMerges(days, slots, assignments);

  function handleAssign(day, slotId, subjectId, span) {
    setOpenCell(null);
    setComponentValue({ action: "assign", day, slot_id: slotId, subject_id: subjectId, span: span || 1, nonce: Date.now() + Math.random() });
  }
  function handleClear(day, slotId, span) {
    setComponentValue({ action: "clear", day, slot_id: slotId, span: span || 1, nonce: Date.now() + Math.random() });
  }

  return html`
    <table>
      <thead>
        <tr>
          <th class="day-header">Day</th>
          ${slots.map((slot) => html`
            <th key=${slot.id} class=${`slot-header${slot.is_break ? ' slot-header-break' : ''}`}>
              ${slot.label}<span class="slot-time">${slot.start_time}–${slot.end_time}</span>
            </th>
          `)}
        </tr>
      </thead>
      <tbody>
        ${days.map((day) => html`
          <tr key=${day}>
            <td class="daylabel">${day}</td>
            ${slots.map((slot, si) => {
              const key = day + "|" + slot.id;
              if (skipSet[key]) return null;
              const entry = assignments[key];
              const cs = spanMap[key];
              const ms = maxEmptySpan(day, si, slots, assignments);
              return html`<${Cell}
                key=${key}
                day=${day}
                slot=${slot}
                entry=${entry}
                subjects=${subjects}
                isOpen=${openCell === key}
                onOpen=${(d, s) => setOpenCell(d + "|" + s)}
                onClose=${() => setOpenCell(null)}
                onAssign=${handleAssign}
                onClear=${handleClear}
                colSpan=${cs}
                isBreak=${slot.is_break}
                maxSpan=${ms}
              />`;
            })}
          </tr>
        `)}
      </tbody>
    </table>
  `;
}

/* ── Streamlit render loop ── */
function render(args) {
  ReactDOM.render(e(App, { args: args }), document.getElementById("root"));
  setTimeout(reportHeight, 30);
}

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || !data.type) return;
  if (data.type === "streamlit:render") {
    render(data.args);
  }
});

postToStreamlit("streamlit:componentReady", { apiVersion: 1 });
reportHeight();
</script>
</body>
</html>
